<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mahanakhon Rooftop VR</title>
  <!-- A-Frame core. PINNED — 1.8.0 is the current release (published 2026-06-23,
       verified against the npm registry dist-tags and aframevr/aframe releases).
       Never point this at /releases/latest/. See CLAUDE.md §2 before bumping. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <!-- Components live in /js — no inline JS in this file (CLAUDE.md, Conventions). -->
  <script src="js/gradient-sky.js"></script>
  <script src="js/sky-time.js"></script>
  <script src="js/tower-clip.js"></script>
  <script src="js/character-controller.js"></script>
  <script src="js/third-person-camera.js"></script>
  <script src="js/view-switch.js"></script>
  <script src="js/photo-skybox.js"></script>
  <script src="js/ambient-audio.js"></script>
  <script src="js/deck-features.js"></script>
  <script src="js/touch-controls.js"></script>
  <link rel="stylesheet" href="css/overlay.css" />
</head>
<body>
  <a-scene renderer="colorManagement: true; antialias: true"
           ambient-audio="button: #btn-sound; volume: 0.5"
           sky-time="sky: a-sky; sun: #sun; ambient: #ambient; button: #btn-sky"
           fog="type: linear; color: #cdd9e5; near: 350; far: 4600">

    <a-assets>
      <!-- Kana by "ddd" (sketchfab.com/endonoriko), CC-BY-4.0. Mixamo rig.
           Idle = the Tablet clip; Walk = a Mixamo walk cycle with its root
           motion stripped. See README for the conversion pipeline. -->
      <a-asset-item id="avatar-model" src="assets/models/avatar.glb"></a-asset-item>
      <!-- The tower, converted from the SketchUp STL. Roof slab at y=0, base at
           y=-314, antenna masts to y=+10. Visual only. -->
      <a-asset-item id="tower-model" src="assets/models/tower.glb"></a-asset-item>
      <!-- Photo-derived Level 78 deck: terrace, glass tray, stairs and The Peak. -->
      <a-asset-item id="deck-model" src="assets/models/deck.glb"></a-asset-item>
      <!-- Bangkok, extruded from OSM footprints. Data (c) OpenStreetMap
           contributors, ODbL — see README. Visual only. -->
      <a-asset-item id="skyline-model" src="assets/models/skyline.glb"></a-asset-item>
      <!-- Walkable surface. Never rendered — the controller only casts rays at it. -->
      <a-asset-item id="navmesh-model" src="assets/nav/navmesh.glb"></a-asset-item>
    </a-assets>

    <!-- Procedural gradient rather than a flat dome: the pale horizon band is
         what makes 314 m read as height. Fog uses the same horizon colour so
         distant geometry dissolves into it instead of ending at a hard edge. -->
    <!-- Real 360 photo backdrop. Drops in behind everything once the panorama
         is in the repo: set src to assets/panoramas/skyline.jpg and turn `yaw`
         until the skyline lines up with the deck. Empty src = inactive, and the
         gradient sky below shows through. -->
    <a-entity id="panorama" photo-skybox="src: ; yaw: 0; radius: 9000"></a-entity>

    <a-sky radius="12000"
           material="shader: gradient-sky; topColor: #3f7cad; horizonColor: #cdd9e5; exponent: 0.8; horizonBias: -0.3"></a-sky>

    <!-- ===================== THE TOWER =====================
         King Power MahaNakhon, from the SketchUp STL. 4562 triangles, one flat
         facade material. Kept whole so the drop to the street reads from the
         deck edge. class="collider" keeps the third-person camera out of the
         rooftop plant rooms. -->
    <!-- tower-clip removes the STL roof above deck level: the deck blockout and
         the model describe the same floor, and the plant rooms punched through it. -->
    <a-entity id="tower" class="collider" gltf-model="#tower-model" tower-clip="height: 0.02"></a-entity>
    <!-- Simple solid shell used only for airborne player collision. Keeping it
         separate avoids the detailed tower roof blocking the stair approach. -->
    <a-box id="tower-player-shell" class="player-collider" position="0 -157 0"
           width="38.4" height="314" depth="19.2"
           material="visible: false"></a-box>

    <!-- The walkable deck, sitting on the roof slab at y=0. -->
    <a-entity id="deck" class="collider" gltf-model="#deck-model"></a-entity>

    <!-- Bangkok. Real building footprints extruded to tagged heights, plus the
         Chao Phraya. Shares the tower's plan rotation so the city lines up with
         the building it surrounds. -->
    <a-entity id="skyline" gltf-model="#skyline-model"></a-entity>

    <!-- Ground under the city: streets, blocks, everything OSM has no polygon
         for. Sits just below the extrusions' base. -->
    <a-plane id="ground" position="0 -314.2 0" rotation="-90 0 0"
             width="14000" height="14000" material="color: #71787c; roughness: 1"></a-plane>

    <!-- Lighting -->
    <a-entity id="ambient" light="type: hemisphere; intensity: 0.9; color: #ffffff; groundColor: #444"></a-entity>
    <a-entity id="sun" light="type: directional; intensity: 0.7" position="140 288 -240"></a-entity>

    <a-entity id="navmesh" gltf-model="#navmesh-model"></a-entity>

    <!-- ===================== DECK FURNITURE ===================== -->
    <a-entity id="sign" position="11 1.55 -7">
      <a-entity canvas-sign="title: Mahanakhon SkyWalk; subtitle: 314 m"></a-entity>
      <a-box position="-1.5 -0.62 0" width="0.08" height="1.2" depth="0.08"
             material="color: #2a2f36; roughness: 0.7"></a-box>
      <a-box position="1.5 -0.62 0" width="0.08" height="1.2" depth="0.08"
             material="color: #2a2f36; roughness: 0.7"></a-box>
    </a-entity>

    <!-- Viewpoints. Targets are on the navmesh; check against it if you move them. -->
    <a-entity class="clickable" position="17 0.05 0"
              viewpoint="player: #player; target: 17 0.05 0; label: Glass tray"></a-entity>
    <a-entity class="clickable" position="10 0.05 6.5"
              viewpoint="player: #player; target: 10 0.05 6.5; label: Middle terrace"></a-entity>
    <a-entity class="clickable" position="-7 4.05 0"
              viewpoint="player: #player; target: -7 4.05 0; label: The Peak"></a-entity>

    <!-- ===================== PLAYER =====================
         Desktop: click-drag to look, WASD to move, Shift to move faster,
         V to switch between first and third person.

         character-controller owns the rig position and the avatar's yaw.
         look-controls lives on the PIVOT, not the camera — that is what makes
         the third-person camera orbit the avatar's head instead of turning on
         the spot. The camera keeps an identity rotation and is simply offset
         back along the pivot, so both views share one heading and switching
         between them cannot desync movement. -->
    <a-entity id="player" position="10 0.05 0"
              character-controller="avatar: #you; camera: #cam; navmesh: #navmesh; respawn: 10 0.05 0"
              view-switch="camera: #cam; button: #view-toggle"
              fall-fade="overlay: #fade"
              touch-controls="player: #player; pad: #dpad; jump: #btn-jump">

      <a-entity id="pivot" position="0 1.6 0"
                look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: false">
        <!-- far has to clear the 314 m drop plus the ground plane; near is
             pulled off A-Frame's 0.005 default to keep depth precision usable
             across that range. -->
        <a-entity id="cam" camera="active: true; near: 0.1; far: 20000"
                  third-person-camera="pivot: #pivot; avatar: #you; distance: 3.2; height: 0.65"
                  cursor="rayOrigin: mouse; fuse: false"
                  raycaster="objects: .clickable; far: 60"></a-entity>
      </a-entity>

      <!-- "You" — rigged Mixamo avatar, yawed to face travel by the controller.
           Visibility is driven by the camera's actual distance, not the mode. -->
      <a-entity id="you" visible="false" gltf-model="#avatar-model"></a-entity>
    </a-entity>
  </a-scene>

  <div id="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk ·
    <kbd>Shift</kbd> faster · <kbd>Space</kbd> jump ·
    drag to look · <kbd>V</kbd> view · click a ring to travel
  </div>

  <!-- ODbL requires attribution wherever the data is shown, so this is on
       screen rather than only in the README. -->
  <div id="credit">
    Building data ©
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
    contributors, <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>
  </div>

  <button id="view-toggle" type="button" aria-pressed="false">First-person</button>
  <button id="btn-sound" type="button" aria-pressed="false">Sound on</button>
  <button id="btn-sky" type="button" aria-label="Time of day">Day</button>

  <!-- Touch controls. Hidden by default; touch-controls reveals them only on
       devices that actually report touch support. -->
  <div id="dpad" aria-hidden="true">
    <button type="button" data-dir="up"    aria-label="Forward">▲</button>
    <button type="button" data-dir="left"  aria-label="Left">◀</button>
    <button type="button" data-dir="right" aria-label="Right">▶</button>
    <button type="button" data-dir="down"  aria-label="Back">▼</button>
  </div>
  <button id="btn-jump" type="button" aria-hidden="true">Jump</button>

  <!-- Fade for the 314 m drop. Covers everything including the overlay. -->
  <div id="fade" aria-hidden="true"></div>
</body>
</html>

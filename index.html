<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mahanakhon SkyWalk · 314 m — kingpowerwalk</title>
  <meta name="description" content="A walkable reconstruction of the King Power Mahanakhon rooftop observation deck, Bangkok.">

  <!--
    A-Frame 1.8.0 — PINNED. Latest release, published 2026-06-23.
    Never point this at /releases/latest/. See CLAUDE.md §2 before bumping.
  -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Behaviour lives in /js. No inline JS in this file (CLAUDE.md, Conventions). -->
  <script src="js/view-switch.js"></script>

  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>

<a-scene
  fog="type: linear; color: #b6c9d8; near: 70; far: 620"
  renderer="antialias: true; colorManagement: true; sortObjects: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  background="color: #8fb4d4">

  <!--
    ========================================================================
    PHASE 0 PLACEHOLDER GEOMETRY
    Blocky stand-in for the real deck. Proportions are approximate and are
    NOT the reference geometry — Phase 3 replaces all of this with a
    Blender-modelled glTF (assets/models/deck.glb). Don't refine it here.
    Deck is 50 m square, sitting at y = 0. Real roof height is 314 m.
    ========================================================================
  -->

  <!-- Sun -->
  <a-entity light="type: ambient; color: #cfe0ee; intensity: 0.75"></a-entity>
  <a-entity light="type: directional; color: #fff4e2; intensity: 0.85; castShadow: false"
            position="-30 50 20"></a-entity>

  <!-- Deck slab -->
  <a-box id="deck" position="0 -0.2 0" width="50" height="0.4" depth="50"
         material="color: #9d9fa6; roughness: 0.95"></a-box>

  <!-- Parapet: N / E / W solid, S split to leave a gap for the glass tray -->
  <a-box class="parapet" position="0 0.55 -24.75" width="50" height="1.1" depth="0.5"
         material="color: #7f8590; roughness: 0.9"></a-box>
  <a-box class="parapet" position="-24.75 0.55 0" width="0.5" height="1.1" depth="50"
         material="color: #7f8590; roughness: 0.9"></a-box>
  <a-box class="parapet" position="24.75 0.55 0" width="0.5" height="1.1" depth="50"
         material="color: #7f8590; roughness: 0.9"></a-box>
  <a-box class="parapet" position="-16 0.55 24.75" width="18" height="1.1" depth="0.5"
         material="color: #7f8590; roughness: 0.9"></a-box>
  <a-box class="parapet" position="16 0.55 24.75" width="18" height="1.1" depth="0.5"
         material="color: #7f8590; roughness: 0.9"></a-box>

  <!-- Glass SkyWalk tray, cantilevered off the south edge -->
  <a-box id="glass-tray" position="0 -0.05 29" width="7" height="0.12" depth="9"
         material="color: #cfe6f2; opacity: 0.34; transparent: true; roughness: 0.05; metalness: 0.1"></a-box>
  <a-box position="-3.6 0.5 29" width="0.15" height="1.1" depth="9"
         material="color: #b7cdd8; opacity: 0.45; transparent: true"></a-box>
  <a-box position="3.6 0.5 29" width="0.15" height="1.1" depth="9"
         material="color: #b7cdd8; opacity: 0.45; transparent: true"></a-box>
  <a-box position="0 0.5 33.4" width="7" height="1.1" depth="0.15"
         material="color: #b7cdd8; opacity: 0.45; transparent: true"></a-box>

  <!-- Central core / spire base -->
  <a-box id="core" position="-7 7 -7" width="11" height="14" depth="11"
         material="color: #8a8f99; roughness: 0.9"></a-box>
  <a-cylinder position="-7 20 -7" radius="0.8" height="12"
              material="color: #6f747d; roughness: 0.8"></a-cylinder>

  <!-- Rooftop bar footprint -->
  <a-box id="bar" position="14 1.6 11" width="13" height="3.2" depth="8"
         material="color: #b3a394; roughness: 0.85"></a-box>

  <!-- Top run of the pixel facade, hinted below the deck edge -->
  <a-box position="-25.5 -3 -12" width="3" height="5" depth="7" material="color: #878d97"></a-box>
  <a-box position="-25.5 -8 6" width="3" height="6" depth="9" material="color: #7d838d"></a-box>
  <a-box position="25.5 -4 -3" width="3" height="6" depth="8" material="color: #878d97"></a-box>
  <a-box position="25.5 -10 14" width="3" height="5" depth="6" material="color: #7d838d"></a-box>
  <a-box position="8 -6 -25.5" width="8" height="6" depth="3" material="color: #838994"></a-box>

  <!--
    Bangkok, 314 m down. A flat stand-in so the altitude reads and the drop off
    the tray isn't into empty space. Phase 4 replaces it with OSM-extruded
    geometry + a real skyline backdrop.
  -->
  <a-plane position="0 -314 0" rotation="-90 0 0" width="4000" height="4000"
           material="color: #6d7f8c; roughness: 1"></a-plane>

  <!--
    ========================================================================
    PLAYER
    Phase 0 uses stock A-Frame controls: look-controls + wasd-controls on the
    camera, which gives camera-relative movement for free. Phase 1 replaces
    this with js/character-controller.js and a navmesh constraint — right now
    there is nothing stopping you walking off the edge.
    ========================================================================
  -->
  <a-entity id="camera"
            camera="fov: 72"
            position="0 1.6 18"
            look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: false"
            wasd-controls="acceleration: 42; fly: false"
            view-switch="avatar: #avatar; button: #view-toggle; distance: 3.6">
  </a-entity>

  <!--
    Placeholder avatar. Hidden in FPS, shown ahead of the camera in TPS.
    Phase 1 swaps this box for a rigged Mixamo glTF at assets/models/avatar.glb.
  -->
  <a-entity id="avatar" visible="false">
    <a-cylinder position="0 0.9 0" radius="0.28" height="1.15"
                material="color: #d8643c; roughness: 0.7"></a-cylinder>
    <a-sphere position="0 1.66 0" radius="0.19"
              material="color: #e8a882; roughness: 0.8"></a-sphere>
    <!-- nose-ish marker so facing direction is legible on a placeholder -->
    <a-box position="0 1.66 -0.2" width="0.08" height="0.08" depth="0.12"
           material="color: #8c4a2a"></a-box>
  </a-entity>

</a-scene>

<!-- ---------------------------------------------------------------- UI -->
<div id="hud">
  <div id="hud-title">Mahanakhon SkyWalk · 314 m</div>
  <div id="hud-hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · drag to look ·
    <kbd>V</kbd> change view
  </div>
  <div id="hud-phase">Phase 0 — placeholder geometry</div>
</div>

<button id="view-toggle" type="button" aria-live="polite">View: First-person</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mahanakhon Rooftop VR</title>
  <!-- A-Frame core. PINNED — 1.8.0 is the current release (published 2026-06-23,
       verified against the npm registry dist-tags and aframevr/aframe releases).
       Never point this at /releases/latest/. See CLAUDE.md §2 before bumping. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <!-- Components live in /js — no inline JS in this file (CLAUDE.md, Conventions). -->
  <script src="js/view-switch.js"></script>
</head>
<body style="margin:0;">
  <a-scene renderer="colorManagement: true; antialias: true"
           fog="type: linear; color: #cdd9e5; near: 45; far: 130">
    <a-sky color="#9fc2e0"></a-sky>

    <!-- ===================== DECK (blocky placeholder, rough real scale) =====================
         Phase 3 replaces this with a Blender-modeled glTF of the real deck. -->
    <a-plane class="deck" rotation="-90 0 0" width="30" height="30" color="#2f2f33"></a-plane>

    <!-- Parapet -->
    <a-box position="0 0.55 -15" width="30"  height="1.1" depth="0.4" color="#17181b"></a-box>
    <a-box position="0 0.55 15"  width="30"  height="1.1" depth="0.4" color="#17181b"></a-box>
    <a-box position="-15 0.55 0" width="0.4" height="1.1" depth="30"  color="#17181b"></a-box>
    <a-box position="15 0.55 0"  width="0.4" height="1.1" depth="30"  color="#17181b"></a-box>

    <!-- Central lift core / spire base placeholder -->
    <a-box position="0 3 0" width="6" height="6" depth="6" color="#3a3d42"></a-box>

    <!-- Glass SkyWalk tray -->
    <a-plane class="deck" position="0 0.02 -16.5" rotation="-90 0 0" width="5" height="4"
             color="#bfe9ff" opacity="0.28" transparent="true"></a-plane>

    <!-- Simplified skyline ring (conveys 314 m altitude; Phase 4 replaces with real/low-poly city) -->
    <a-box position="-40 15 -30" width="8"  height="30" depth="8"  color="#8aa0b6"></a-box>
    <a-box position="35 20 -45"  width="10" height="40" depth="10" color="#7e94ab"></a-box>
    <a-box position="-55 25 20"  width="12" height="50" depth="12" color="#8aa0b6"></a-box>
    <a-box position="50 12 30"   width="9"  height="24" depth="9"  color="#93a8bd"></a-box>

    <!-- Lighting -->
    <a-entity light="type: hemisphere; intensity: 0.9; color: #ffffff; groundColor: #444"></a-entity>
    <a-entity light="type: directional; intensity: 0.7" position="1 4 2"></a-entity>

    <!-- ===================== PLAYER =====================
         Desktop: click-drag to look, WASD to move. Mobile: gyro. Quest: 6DoF + Enter VR.
         Press V to preview the FPS/TPS toggle.
         wasd on the rig keeps the camera + avatar together (world-axis; Phase 1
         makes it camera-relative and swaps the box avatar for a rigged Mixamo one). -->
    <a-entity id="player" view-switch wasd-controls="acceleration: 25; fly: false" position="0 0 6">
      <a-camera id="cam" position="0 1.6 0" wasd-controls="enabled: false"></a-camera>
      <!-- Placeholder avatar ("you") — Phase 1 replaces with a rigged Mixamo glTF -->
      <a-entity id="you" visible="false">
        <a-cylinder position="0 0.9 0" radius="0.28" height="1.2" color="#c94f4f"></a-cylinder>
        <a-sphere   position="0 1.7 0" radius="0.22" color="#e0a37a"></a-sphere>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
